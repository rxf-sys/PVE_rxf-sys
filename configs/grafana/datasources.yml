# Grafana Datenquellen - CT 106 (monitoring)
# /etc/grafana/provisioning/datasources/datasources.yml
# Nach Zusammenlegung: Prometheus ist jetzt lokal auf demselben Container

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true
