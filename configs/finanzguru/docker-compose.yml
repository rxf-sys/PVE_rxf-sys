# Finanzguru (Orynthia) - CT 111
# /srv/appdata/Orynthia/docker-compose.yml
# Produktion: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: finanzguru-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finanzguru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-finanzguru}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port 5432 nur intern (nicht exposen!)
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finanzguru}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finanzguru-net

  redis:
    image: redis:7-alpine
    container_name: finanzguru-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # Port 6379 nur intern (nicht exposen!)
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finanzguru-net

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
      target: development
    container_name: finanzguru-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-finanzguru}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finanzguru}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./packages/backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - finanzguru-net

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
      target: development
    container_name: finanzguru-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000/api
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    networks:
      - finanzguru-net

  nginx:
    image: nginx:alpine
    container_name: finanzguru-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - finanzguru-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  finanzguru-net:
    driver: bridge
