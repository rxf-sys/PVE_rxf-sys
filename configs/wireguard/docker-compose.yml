# WireGuard (wg-easy) - CT 102
# /srv/appdata/wireguard/docker-compose.yml

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    environment:
      - LANG=de
      - WG_HOST=rxfsys.duckdns.org
      - PASSWORD_HASH=$$2y$$... # bcrypt Hash des Admin-Passworts
      - WG_PORT=51820
      - WG_DEFAULT_DNS=192.168.2.122
      - WG_ALLOWED_IPS=192.168.2.0/24, 10.8.0.0/24
      - WG_PERSISTENT_KEEPALIVE=25
    volumes:
      - ./config:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
