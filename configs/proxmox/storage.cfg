# /etc/pve/storage.cfg
# Proxmox Storage-Konfiguration

dir: local
    path /var/lib/vz
    content iso,vztmpl,backup
    maxfiles 3

lvmthin: local-lvm
    thinpool data
    vgname pve
    content rootdir,images

# PBS Storage (falls konfiguriert)
# pbs: pbs
#     server 192.168.2.129
#     datastore backups
#     content backup
#     fingerprint <PBS-FINGERPRINT>
#     username root@pam
