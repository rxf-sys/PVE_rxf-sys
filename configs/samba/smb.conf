# /etc/samba/smb.conf
# Samba-Konfiguration (CT 100)

[global]
    workgroup = WORKGROUP
    server string = HomeLab NAS
    server role = standalone server
    log file = /var/log/samba/log.%m
    max log size = 1000
    logging = file
    panic action = /usr/share/samba/panic-action %d
    server role = standalone server
    obey pam restrictions = yes
    unix password sync = yes
    passwd program = /usr/bin/passwd %u
    passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
    pam password change = yes
    map to guest = bad user
    usershare allow guests = yes

    # Papierkorb
    vfs objects = recycle
    recycle:repository = .recycle/%U
    recycle:keeptree = yes
    recycle:versions = yes

[shared]
    comment = Gemeinsame Dateien
    path = /srv/shared
    browseable = yes
    read only = no
    valid users = homeserver
    create mask = 0660
    directory mask = 0770

[media]
    comment = Medien (Filme, Musik, Fotos)
    path = /srv/media
    browseable = yes
    read only = no
    valid users = homeserver
    create mask = 0664
    directory mask = 0775

[backups]
    comment = Geraete-Backups
    path = /srv/backups
    browseable = yes
    read only = no
    valid users = homeserver
    create mask = 0660
    directory mask = 0770
